name: money_mate
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.4

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  device_preview: ^1.3.1
  flutter_screenutil: ^5.9.3
  fl_chart: ^1.1.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7
  isar_plus: ^1.2.2
  isar_plus_flutter_libs: ^1.2.2
  flutter_doc_scanner: ^0.0.17
  camera: ^0.12.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  go_router: ^17.1.0
  path_provider: ^2.1.5
  month_picker_dialog: ^6.7.1
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

dependency_overrides:
  image: ^4.2.0
  archive: ^3.3.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo_1.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#00897b"
  image: assets/icons/logo_1.png
  android_12:
    image: assets/icons/logo_1.png
    icon_background_color: "#00897b"
  web: false

flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/icons/
   - assets/avatars/
   - assets/avatars/marvel/
   - assets/avatars/dc/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/Poppins/Poppins-Bold.ttf
          weight: 700
