name: Flutter CI/CD - Money Mate

on:
  push:
    branches:
      - dev_sony

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set Up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 🧪 Run Tests
        run: flutter test --verbose

  # ─────────────────────────────────────────────
  # JOB 2: Auto Tag (runs after test passes)
  # ─────────────────────────────────────────────
  auto-tag:
    name: 🏷️ Auto Tag from pubspec.yaml
    runs-on: ubuntu-latest
    needs: test
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.TAG_EXISTS }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to check existing tags

      - name: 🔎 Extract Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version found: $VERSION"

      - name: 🔍 Check If Tag Already Exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.APP_VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG already exists — skipping release."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG does not exist — will create."
          fi

      - name: 🏷️ Create & Push Tag
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ steps.version.outputs.APP_VERSION }}"
          git push origin "v${{ steps.version.outputs.APP_VERSION }}"
          echo "✅ Tag v${{ steps.version.outputs.APP_VERSION }} pushed!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3: Build & Release APK
  # ─────────────────────────────────────────────
  release:
    name: 🚀 Build & Release APK
    runs-on: ubuntu-latest
    needs: auto-tag
    if: needs.auto-tag.outputs.tag_exists == 'false'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set Up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.auto-tag.outputs.app_version }}"
          name: "💰 Money Mate v${{ needs.auto-tag.outputs.app_version }}"
          body: |
            ## 💰 Money Mate v${{ needs.auto-tag.outputs.app_version }}

            **Branch:** dev_sony  
            **Commit:** ${{ github.sha }}  
            **Triggered by:** @${{ github.actor }}

            ---
            📲 Download the APK below and install on your Android device.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}