name: Flutter CI/CD - Money Mate

on:
  push:
    branches:
      - dev_sony

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set Up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 🧪 Run Tests
        run: flutter test --verbose

  # ─────────────────────────────────────────────
  # JOB 2: Auto Tag
  # ─────────────────────────────────────────────
  auto-tag:
    name: 🏷️ Auto Tag from pubspec.yaml
    runs-on: ubuntu-latest
    needs: test
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.TAG_EXISTS }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Extract Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Check Tag
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.APP_VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create Tag
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ steps.version.outputs.APP_VERSION }}"
          git push origin "v${{ steps.version.outputs.APP_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3: Build & Release APK
  # ─────────────────────────────────────────────
  release:
    name: 🚀 Build & Release APK
    runs-on: ubuntu-latest
    needs: auto-tag
    if: needs.auto-tag.outputs.tag_exists == 'false'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set Up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      # 🔐 STEP 1: Decode Keystore
      - name: 🔐 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore

      # 🔐 STEP 2: Create key.properties
      - name: 📝 Create key.properties
        run: |
          echo "storeFile=release.keystore" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      # 🏗️ Build APK
      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      # 🚀 Release
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.auto-tag.outputs.app_version }}"
          name: "💰 Money Mate v${{ needs.auto-tag.outputs.app_version }}"
          body: |
            ## 💰 Money Mate v${{ needs.auto-tag.outputs.app_version }}

            **Branch:** dev_sony  
            **Commit:** ${{ github.sha }}  
            **Triggered by:** @${{ github.actor }}

            ---
            📲 Download APK below.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}